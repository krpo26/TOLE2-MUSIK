workflows:
  android-apk:
    name: Reproductor - APK Android
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Generar carpeta android si falta
        script: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name audio_player --org com.example .
          fi
          python3 tools/patch_android.py
      - name: Dependencias
        script: flutter pub get
      - name: Compilar APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - TU_CORREO@ejemplo.com
